name: Wire Páscoa embedded presentation media

on:
  push:
    branches:
      - tenant/colegio-pascoa

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.event.head_commit.message != 'Wire Páscoa embedded presentation media' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tenant/colegio-pascoa
          fetch-depth: 0
      - name: Wire embedded tenant media
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          landing = Path('frontend/src/pages/public/PascoaLanding.tsx')
          text = landing.read_text(encoding='utf-8')
          old = "import { useTenant } from '@/contexts/TenantContext';\n\nconst HERO = '/tenants/colegio-pascoa/pascoa-hero.jpg';\nconst COMMUNITY = '/tenants/colegio-pascoa/pascoa-community.jpg';\nconst CAMPUS = '/tenants/colegio-pascoa/pascoa-campus.jpg';\nconst VIDEO = '/tenants/colegio-pascoa/pascoa-learning-preview.mp4';"
          new = "import { useTenant } from '@/contexts/TenantContext';\nimport { PASCOA_HERO } from '@/tenants/colegio-pascoa/media/pascoa_hero';\nimport { PASCOA_COMMUNITY } from '@/tenants/colegio-pascoa/media/pascoa_community';\nimport { PASCOA_CAMPUS } from '@/tenants/colegio-pascoa/media/pascoa_campus';\nimport { PASCOA_VIDEO } from '@/tenants/colegio-pascoa/media/pascoa_video';\n\nconst HERO = PASCOA_HERO;\nconst COMMUNITY = PASCOA_COMMUNITY;\nconst CAMPUS = PASCOA_CAMPUS;\nconst VIDEO = PASCOA_VIDEO;"
          if old in text:
              landing.write_text(text.replace(old, new), encoding='utf-8')

          login = Path('frontend/src/pages/auth/PascoaLogin.tsx')
          text = login.read_text(encoding='utf-8')
          if "@/tenants/colegio-pascoa/media/pascoa_hero" not in text:
              text = text.replace(
                  "import { ROLE_HOME } from '@/types/roles';\n\nconst HERO = '/tenants/colegio-pascoa/pascoa-hero.jpg';",
                  "import { ROLE_HOME } from '@/types/roles';\nimport { PASCOA_HERO } from '@/tenants/colegio-pascoa/media/pascoa_hero';\n\nconst HERO = PASCOA_HERO;",
              )
              login.write_text(text, encoding='utf-8')
          PY
      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Media already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/public/PascoaLanding.tsx frontend/src/pages/auth/PascoaLogin.tsx
          git commit -m "Wire Páscoa embedded presentation media"
          git push origin HEAD:tenant/colegio-pascoa
