name: Validate final landing refinement

on:
  push:
    branches:
      - presentation/colegio-deus-connosco

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Landing guard
        run: |
          grep -q 'Da escola ao portal' frontend/src/pages/public/LandingPage.tsx
          grep -q 'Escolher acesso' frontend/src/pages/public/LandingPage.tsx
          grep -q 'to="/login"' frontend/src/pages/public/LandingPage.tsx
          grep -q 'A Escola' frontend/src/pages/public/LandingPage.tsx
