name: Validate Front Experience 2.0

on:
  push:
    branches:
      - presentation/colegio-deus-connosco

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Public experience guard
        run: |
          ! grep -nEi "apresentação institucional|aced(er|er) à demonstração|7 perfis de portal|explorar os 7 perfis" frontend/src/pages/public/LandingPage.tsx
          grep -q "framer-motion" frontend/package.json
          grep -q "prefersReducedMotion" frontend/src/pages/public/LandingPage.tsx
