name: Validate login role selector flow

on:
  push:
    branches:
      - presentation/colegio-deus-connosco

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Login flow guard
        run: |
          grep -q "pendingRole" frontend/src/pages/auth/LoginPage.tsx
          grep -q "Perfil de acesso" frontend/src/pages/auth/LoginPage.tsx
          grep -q "Entrar como" frontend/src/pages/auth/LoginPage.tsx
          ! grep -q "if (isAuthenticated && role)" frontend/src/pages/auth/LoginPage.tsx
          grep -q 'path="/login"' frontend/src/app/router/appRouter.tsx
