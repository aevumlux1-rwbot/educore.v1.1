name: Materialize Colégio Páscoa media

on:
  push:
    branches:
      - tenant/colegio-pascoa

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[pascoa-media-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tenant branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover intact tenant media from repository history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/public/tenants/colegio-pascoa

          python - <<'PY'
          from pathlib import Path
          import base64, re, subprocess

          root = Path('frontend')
          media = root / 'src/tenants/colegio-pascoa/media'
          public = root / 'public/tenants/colegio-pascoa'
          public.mkdir(parents=True, exist_ok=True)

          specs = [
              ('logo', 'PASCOA_LOGO', public / 'pascoa-logo.jpg', 'image/jpeg', '/tenants/colegio-pascoa/pascoa-logo.jpg', media / 'pascoa_logo.ts'),
              ('hero', 'PASCOA_HERO', public / 'pascoa-hero.jpg', 'image/jpeg', '/tenants/colegio-pascoa/pascoa-hero.jpg', media / 'pascoa_hero.ts'),
              ('community', 'PASCOA_COMMUNITY', public / 'pascoa-community.jpg', 'image/jpeg', '/tenants/colegio-pascoa/pascoa-community.jpg', media / 'pascoa_community.ts'),
              ('campus', 'PASCOA_CAMPUS', public / 'pascoa-campus.jpg', 'image/jpeg', '/tenants/colegio-pascoa/pascoa-campus.jpg', media / 'pascoa_campus.ts'),
              ('video', 'PASCOA_VIDEO', public / 'pascoa-learning-preview.mp4', 'video/mp4', '/tenants/colegio-pascoa/pascoa-learning-preview.mp4', media / 'pascoa_video.ts'),
          ]

          def run(*args):
              return subprocess.run(args, text=True, capture_output=True)

          def commits_for(path: str):
              result = run('git', 'log', '--all', '--format=%H', '--', path)
              if result.returncode != 0:
                  return []
              seen = set()
              commits = []
              for sha in result.stdout.splitlines():
                  if sha and sha not in seen:
                      seen.add(sha)
                      commits.append(sha)
              return commits

          def read_at_commit(sha: str, path: str):
              result = run('git', 'show', f'{sha}:{path}')
              return result.stdout if result.returncode == 0 else None

          def extract(text: str, expected_mime: str):
              match = re.search(r"data:([^;]+);base64,([^'\"]+)", text, re.S)
              if not match or match.group(1) != expected_mime:
                  return None, 'missing/mime'
              payload = re.sub(r'\s+', '', match.group(2))
              if '[...' in payload or '...]' in payload:
                  return None, 'literal ellipsis corruption'
              try:
                  data = base64.b64decode(payload, validate=True)
              except Exception as exc:
                  return None, f'base64: {exc}'
              if expected_mime == 'image/jpeg':
                  if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
                      return None, 'jpeg magic/eoi'
              elif expected_mime == 'video/mp4':
                  if b'ftyp' not in data[:32]:
                      return None, 'mp4 magic'
              return data, 'ok'

          for asset, const_name, destination, expected_mime, public_path, module_path in specs:
              repo_path = f'frontend/src/tenants/colegio-pascoa/media/pascoa_{asset}.ts'
              chosen = None
              reasons = []
              commits = commits_for(repo_path)
              print(f'{const_name}: scanning {len(commits)} historical versions')
              for sha in commits:
                  text = read_at_commit(sha, repo_path)
                  if text is None:
                      continue
                  data, reason = extract(text, expected_mime)
                  reasons.append(f'{sha[:10]}:{reason}')
                  if data is not None:
                      chosen = (sha, data)
                      break

              if chosen is None:
                  print(f'No intact source for {const_name}:')
                  for reason in reasons:
                      print('  ' + reason)
                  raise SystemExit(1)

              sha, data = chosen
              destination.write_bytes(data)
              module_path.write_text(
                  "// Presentation tenant asset path. In SaaS production this resolves from tenant object storage/CDN.\n"
                  f"export const {const_name} = '{public_path}';\n",
                  encoding='utf-8',
              )
              print(f'{const_name}: {len(data)} bytes from commit {sha[:12]} -> {destination}')
          PY

      - name: Verify generated files
        run: |
          set -euo pipefail
          file frontend/public/tenants/colegio-pascoa/*
          test -s frontend/public/tenants/colegio-pascoa/pascoa-logo.jpg
          test -s frontend/public/tenants/colegio-pascoa/pascoa-hero.jpg
          test -s frontend/public/tenants/colegio-pascoa/pascoa-community.jpg
          test -s frontend/public/tenants/colegio-pascoa/pascoa-campus.jpg
          test -s frontend/public/tenants/colegio-pascoa/pascoa-learning-preview.mp4

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Commit materialized media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/tenants/colegio-pascoa frontend/src/tenants/colegio-pascoa/media
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "[pascoa-media-materialized] Serve Páscoa media as static tenant assets"
          git push origin HEAD:tenant/colegio-pascoa
